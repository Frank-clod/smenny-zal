<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Форма дома</title>
<meta name="theme-color" content="#151114" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F1F2" media="(prefers-color-scheme: light)">
<meta name="description" content="Домашние тренировки: ягодицы, ноги, тонус">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-thumb column for an evening at home; mini-band colours as load chips; bottom tab bar */
:root{
  --bg:#F4F1F2; --surface:#FFFFFF; --surface2:#F6F2F4; --line:#E4DCE0;
  --fg:#1D161A; --muted:#6B5F66; --accent:#B3365E; --accent-ink:#FFFFFF; --accent-bg:rgba(179,54,94,.09);
  --good:#1B8A4C; --good-bg:rgba(27,138,76,.10); --warn:#AD6700; --warn-bg:rgba(214,138,20,.13); --bad:#C63A33; --bad-bg:rgba(198,58,51,.09);
  --b0:#39B54A; --b1:#2F6FE0; --b2:#E8B923; --b3:#D93A2B; --b4:#1E1E1E; --chip-dark:#16181B; --chip-light:#FFFFFF;
  --f-display:"Unbounded","Arial Black",sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151114; --surface:#1E181C; --surface2:#271F24; --line:#372C32;
  --fg:#F1EAED; --muted:#A3949C; --accent:#F07A9B; --accent-ink:#2A0A15; --accent-bg:rgba(240,122,155,.14);
  --good:#45C07A; --good-bg:rgba(69,192,122,.15); --warn:#F0A43A; --warn-bg:rgba(240,164,58,.15); --bad:#EF5F57; --bad-bg:rgba(239,95,87,.15);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151114; --surface:#1E181C; --surface2:#271F24; --line:#372C32;
  --fg:#F1EAED; --muted:#A3949C; --accent:#F07A9B; --accent-ink:#2A0A15; --accent-bg:rgba(240,122,155,.14);
  --good:#45C07A; --good-bg:rgba(69,192,122,.15); --warn:#F0A43A; --warn-bg:rgba(240,164,58,.15); --bad:#EF5F57; --bad-bg:rgba(239,95,87,.15);
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 170px;display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.where{font-size:12px;color:var(--muted)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
h1{font-family:var(--f-display);font-size:26px;line-height:1.1;font-weight:600;letter-spacing:-.02em;text-wrap:balance;margin:2px 0 0}
h2{font-family:var(--f-display);font-size:17px;font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:17px;font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:12px} .stack-s{display:grid;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.btn{font-weight:600;font-size:16px;border-radius:12px;padding:12px 16px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 2px;text-align:center;font-size:11px;color:var(--muted);display:grid;gap:3px;justify-items:center;min-width:0}
.wd b{font-size:17px;color:var(--fg);font-weight:600;line-height:1.1}
.wd.today{border:2px solid var(--accent);padding:6px 1px}
.marks{display:flex;gap:3px;min-height:16px;align-items:center}
.mk{font:600 10px/16px var(--f-mono);border-radius:5px;padding:0 4px;background:var(--accent-bg);color:var(--accent)}
.mk.c{background:var(--surface2);color:var(--muted)}
.goal{display:flex;align-items:center;gap:12px}
.goal-dots{display:flex;gap:6px}
.gdot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.gdot.on{background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.tile b{font:600 22px/1.1 var(--f-display);display:block;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .r{text-align:right;font-weight:600;white-space:nowrap}
.li .why{grid-column:1 / -1}
.msg{border-radius:12px;padding:10px 12px;font-size:14px}
.msg.good{background:var(--good-bg)} .msg.warn{background:var(--warn-bg)} .msg.bad{background:var(--bad-bg)} .msg.info{background:var(--accent-bg)}
.msg strong{font-weight:600}
.msg.good strong{color:var(--good)} .msg.warn strong{color:var(--warn)} .msg.bad strong{color:var(--bad)} .msg.info strong{color:var(--accent)}
.load{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.band{display:inline-block;width:22px;height:12px;border-radius:6px;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.band.b0{background:var(--b0)} .band.b1{background:var(--b1)} .band.b2{background:var(--b2)} .band.b3{background:var(--b3)} .band.b4{background:var(--b4)}
.target{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.target b{font:600 22px var(--f-display)}
.target .sch{margin-left:auto;font-weight:600;font-size:17px}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:20px minmax(0,1.2fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.set.nl{grid-template-columns:20px minmax(0,1fr) 52px}
.set-h{font-size:12px;color:var(--muted)}
.set .n{color:var(--muted);text-align:center;font-weight:600}
.set input,.set select{font-size:19px;font-weight:600;background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:8px 6px;width:100%;min-height:48px;text-align:center;font-variant-numeric:tabular-nums}
.set select{font-size:14px;text-align:left;padding-inline:8px}
.set input::placeholder{color:var(--muted);opacity:.75}
.set.done input,.set.done select{border-color:var(--good);background:var(--good-bg)}
.ok{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);display:grid;place-items:center}
.set.done .ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.err{color:var(--bad);font-size:13px;grid-column:2 / -1}
.tech summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--accent)}
.tech p{margin-top:6px;font-size:14px}
.badge{font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
select.field,input.field{font-size:16px;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
label.lbl{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
details.wo{border-top:1px solid var(--line);padding-top:10px}
details.wo:first-of-type{border-top:0;padding-top:0}
details.wo summary{cursor:pointer;font-weight:600;font-size:16px}
.hbtn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;cursor:pointer;padding:12px 0;border-top:1px solid var(--line)}
.hbtn:first-child{border-top:0}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.prog:first-child{border-top:0}
.up{color:var(--good);font-weight:600}
.fig{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;background:var(--surface2);border-radius:14px;padding:8px 6px 6px}
.fig.single{grid-template-columns:minmax(0,1fr)}
.fig figure{margin:0;display:grid;gap:2px;justify-items:center;min-width:0}
.fig svg{width:100%;max-width:150px;height:auto;display:block}
.fig figcaption{font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.fig-arrow{color:var(--muted);font-size:16px}
.fg-body,.fg-body2{fill:none;stroke:var(--fg);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.fg-body2{opacity:.55}
.fg-head{fill:var(--fg)}
.fg-arm{fill:none;stroke:var(--accent);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fg-eq-fill{fill:var(--b2)}
.fg-floor{stroke:var(--line);stroke-width:1.5}
.fg-prop{fill:var(--line)}
.fg-propline{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
.fg-ball{fill:none;stroke:var(--muted);stroke-width:2}
.fg-band{stroke:var(--b1);stroke-width:2.4;stroke-linecap:round}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--surface2);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:52px;display:grid;gap:0;justify-items:center;align-content:center;font-weight:600;color:var(--muted);padding:4px}
.seg button small{font-size:11px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.seg button .nx{color:var(--accent)}
.empty{padding:20px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.go-bar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:9;padding-inline:12px}
.go-in{max-width:540px;margin:0 auto;background:var(--surface);border:1px solid var(--accent);border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px}
.go-in>div{flex:1;min-width:0;display:grid}
.go-in b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go-in span{font-size:12px;color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));z-index:10}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;color:var(--muted);font-size:12px;font-weight:500;display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:52px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.upd{position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;max-width:540px;margin:0 auto;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
@media (max-width:370px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))} h1{font-size:23px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var app=$('#app');

/* ---------- Program ---------- */
var BANDS=['зелёная','синяя','жёлтая','красная','чёрная'];
var EX={
  bridge:{n:'Ягодичный мост с гантелью',L:'kg',start:8,sets:3,lo:12,hi:15,rest:60,m:'Ягодицы, задняя поверхность бедра',tip:'Лёжа на спине, стопы на ширине таза, гантель на тазовых костях (подложи полотенце). Поднимай таз до прямой линии от колен до плеч, вверху сожми ягодицы на 1–2 секунды. Поясницу не прогибай. Мини-лента над коленями — по желанию, колени держи разведёнными.'},
  goblet:{n:'Приседания с гантелью у груди',L:'kg',start:6,sets:3,lo:10,hi:12,rest:75,m:'Ноги, ягодицы',tip:'Гантель вертикально у груди, стопы чуть шире плеч. Садись назад и вниз до параллели бёдер с полом или чуть выше, колени смотрят туда же, куда носки. Спина прямая, пятки не отрываются.'},
  rev_lunge:{n:'Выпады назад с гантелями',L:'kg',start:3,sets:3,lo:8,hi:12,rest:75,per:'на ногу',m:'Ягодицы, ноги',tip:'Гантели в опущенных руках. Шаг назад, опускайся до почти касания коленом пола, корпус чуть вперёд. Толкайся передней ногой через пятку. Сначала все повторы на одну ногу, потом на другую.'},
  side_abd:{n:'Отведения ноги в сторону лёжа',L:'lvl',levels:['без веса','утяжелитель 0,9 кг','утяжелитель + зелёная лента','утяжелитель + синяя лента','утяжелитель + жёлтая лента'],start:1,sets:3,lo:15,hi:20,rest:45,per:'на ногу',m:'Средняя ягодичная — верх и бок бедра',tip:'Лёжа на боку, нижняя нога согнута. Верхнюю прямую ногу поднимай чуть назад, носок смотрит вперёд или слегка вниз. Без рывков, вверху пауза на секунду.'},
  db_row:{n:'Тяга гантели в наклоне с опорой',L:'kg',start:4,sets:3,lo:12,hi:15,rest:60,per:'на руку',m:'Спина, задняя дельта',tip:'Рука и колено на диване или степе, спина ровная. Тяни гантель к тазу локтем, лопатку своди к позвоночнику. Опускай медленно.'},
  pushup:{n:'Отжимания',L:'lvl',levels:['от стены','от дивана','от степа','с колен','классические'],start:1,sets:3,lo:8,hi:12,rest:60,m:'Грудь, руки, мышцы корпуса',tip:'Тело одной линией от головы до колен или пяток, живот подтянут. Опускайся грудью к опоре, локти под углом 45° к корпусу. Чем ниже опора, тем сложнее.'},
  plank:{n:'Планка на локтях',L:'sec',sets:3,lo:20,hi:40,rest:45,m:'Мышцы корпуса, пресс',tip:'Локти под плечами, тело прямой линией. Втяни живот и слегка сожми ягодицы, поясница не провисает. Дыши спокойно.',harder:'добавь 10 секунд к цели или поднимай по очереди ногу на 2 секунды'},
  rdl:{n:'Румынская тяга с гантелями',L:'kg',start:5,sets:3,lo:12,hi:15,rest:75,per:'в руке',m:'Задняя поверхность бедра, ягодицы',tip:'Колени чуть согнуты. Отводи таз назад, гантели скользят вдоль бёдер до середины голени. Спина прямая всё движение. Вверх — сжимая ягодицы.'},
  sumo:{n:'Сумо-приседания с гантелью',L:'kg',start:8,sets:3,lo:12,hi:15,rest:60,m:'Внутренняя часть бедра, ягодицы',tip:'Широкая стойка, носки развёрнуты наружу. Гантель держи вертикально двумя руками. Садись вниз, колени разводи по направлению носков, спина прямая.'},
  stepup:{n:'Зашагивания на степ с гантелями',L:'kg',start:2,sets:3,lo:10,hi:12,rest:60,per:'на ногу',m:'Ягодицы, ноги',tip:'Вся стопа на степе. Поднимайся за счёт ноги, которая на степе, не отталкивайся нижней. Опускайся медленно. Все повторы на одну ногу, потом на другую.'},
  band_walk:{n:'Шаги в сторону с мини-лентой',L:'band',start:1,sets:3,lo:12,hi:15,rest:45,per:'шагов в каждую сторону',m:'Средняя ягодичная, бока бёдер',tip:'Лента над коленями или на щиколотках. Полуприсед, спина прямая. Шагай в сторону, не сводя колени и не раскачивая корпус. Лента натянута всё время.'},
  db_press:{n:'Жим гантелей вверх сидя',L:'kg',start:3,sets:3,lo:10,hi:12,rest:60,per:'в руке',m:'Плечи, трицепс',tip:'Сидя на стуле со спинкой. Гантели у плеч, выжимай вверх, не выпрямляя локти до упора. Поясницу не прогибай.'},

  deadbug:{n:'«Мёртвый жук»',L:'bw',sets:3,lo:8,hi:12,rest:45,per:'на сторону',m:'Глубокие мышцы пресса',tip:'Лёжа на спине, руки вверх, ноги согнуты под 90°. Поясница прижата к полу. Одновременно опускай противоположные руку и ногу, не отрывая поясницу, возвращай и меняй сторону.',harder:'держи лёгкую гантель в руках или выпрямляй ногу полностью'},

    h+='<button class="hbtn" data-act="hist" data-id="'+s.id+'" aria-expanded="'+(S.open===s.id)+'"><span>'+human(s.date)+'</span><span class="num">'+c.d+' подх.</span><span class="small muted">Тренировка '+s.wo+' · '+WO[s.wo].name+'</span><span></span></button>';
    if(S.open===s.id){
      h+='<div class="stack-s" style="padding-bottom:12px">'+s.ex.map(function(e){var dn=e.sets.filter(function(x){return x.ok});return '<div class="spread small"><span>'+esc(EX[e.key].n)+'</span><span class="num muted" style="text-align:right">'+(dn.length?esc(setsTxt(e.key,dn)):'—')+'</span></div>'}).join('');
      h+=(S.confirm===s.id?'<div class="grid2"><button class="btn sm danger" data-act="del-yes" data-id="'+s.id+'">Удалить</button><button class="btn sm" data-act="del-no">Оставить</button></div>':'<div class="row"><button class="btn sm ghost" data-act="reopen" data-id="'+s.id+'">Исправить</button><button class="btn sm ghost" data-act="del-ask" data-id="'+s.id+'">Удалить</button></div>')+'</div>';
    }
  });
  return h+'</div></div></section>';
}
function viewPlan(){
  var st=settings(),h='<section class="stack"><div><p class="eyebrow">Тренировки A → B → C по кругу</p><h1>План</h1></div>';
  h+='<div class="card"><h2>Как это устроено</h2><div class="stack-s small"><p>2–3 тренировки в неделю, в любые вечера. Идут по кругу A → B → C: пропуск ничего не сдвигает, следующая всегда по порядку.</p><p>Между тренировками хотя бы день отдыха. В дни отдыха — дорожка 20–30 минут, если есть силы.</p><p>Каждая тренировка — на всё тело с упором на ноги и ягодицы, около 40 минут.</p></div></div>';
  h+='<div class="card"><h2>Как растёт нагрузка</h2><div class="stack-s small"><p>Все подходы на верхней границе повторов — в следующий раз тяжелее: +1 кг на гантели, следующая лента или вариант сложнее.</p><p>В диапазоне — та же нагрузка, добавляй повторы.</p><p>Два раза подряд не хватило повторов — на шаг легче, потом снова вверх.</p><p>Последние 2 повтора в подходе должны даваться с трудом, но без потери техники.</p></div></div>';
  h+='<div class="card"><h2>Тренировки</h2>';
  ORDER.forEach(function(w){h+='<details class="wo"><summary>'+w+' · '+WO[w].name+'</summary><div class="list" style="margin-top:6px">'+WO[w].ex.map(function(k){var d=EX[k];return '<div class="li"><div>'+esc(d.n)+'<div class="small muted">'+esc(d.m)+'</div></div><div class="r num small">'+schemeTxt({n:d.sets,lo:d.lo,hi:d.hi},k)+'</div></div>'}).join('')+'</div></details>'});
  h+='</div>';
  h+='<div class="card"><h2>Настройки</h2><div class="grid2"><label class="lbl" for="set-goal">Тренировок в неделю<select class="field" id="set-goal" data-set="goal"><option value="2"'+(st.goal==2?' selected':'')+'>2</option><option value="3"'+(st.goal==3?' selected':'')+'>3</option></select></label>';
  h+='<label class="lbl" for="set-step">Шаг гантелей<select class="field" id="set-step" data-set="dbStep">'+[0.5,1,2].map(function(v){return '<option value="'+v+'"'+(+st.dbStep===v?' selected':'')+'>'+fmt(v)+' кг</option>'}).join('')+'</select></label></div></div>';
  var n=doneSessions().length;
  h+='<div class="card"><h2>Резервная копия</h2><p class="small">Записи хранятся только в этом телефоне ('+n+' тренировок). Раз в пару недель сохраняй копию и кидай файл в облако или себе в мессенджер.</p><div class="grid2"><button class="btn" data-act="export">Экспорт</button><label class="btn" for="import-file" style="display:grid;place-items:center;cursor:pointer">Импорт</label></div><input type="file" id="import-file" accept=".json,application/json" hidden>'+(S.io?'<p class="msg '+S.io[0]+'">'+esc(S.io[1])+'</p>':'')+'</div>';
  h+='<div class="card"><h2>Важно</h2><p class="small">Если болят колени, спина или любое упражнение даёт боль, а не усталость в мышцах — пропусти его и скажи, заменим. При беременности или после родов эта программа не подходит без согласования с врачом.</p></div>';
  return h+'</section>';
}
function render(){
  var v=S.view,b;
  if(v==='progress')b=viewProgress();else if(v==='history')b=viewHistory();else if(v==='plan')b=viewPlan();else b=viewToday();
  app.innerHTML=header()+b;
  document.querySelectorAll('.nav button').forEach(function(x){if(x.dataset.view===v)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});
}
function updateCard(i){
  var s=curSession();if(!s)return;var e=s.ex[i],card=app.querySelector('[data-card="'+i+'"]');if(!card)return;
  e.sets.forEach(function(x,j){var r=$('#row-'+i+'-'+j);if(r){r.classList.toggle('done',!!x.ok);var b=r.querySelector('.ok');if(b)b.setAttribute('aria-pressed',x.ok?'true':'false')}});
  card.querySelector('.hint-wrap').innerHTML=hintHTML(s,e);
  var c=countSets(s),g=$('#go-count');if(g)g.textContent='Подходов записано: '+c.d+' из '+c.t;
}

/* ---------- Actions ---------- */
function toggleSet(i,j){
  var s=curSession();if(!s)return;var e=s.ex[i],x=e.sets[j],d=EX[e.key];
  if(x.ok){x.ok=false;persist(s);updateCard(i);return}
  var lIn=$('#l-'+i+'-'+j),rIn=$('#r-'+i+'-'+j),err=$('#err-'+i+'-'+j);
  if(d.L==='kg'){var lv=parseNum(lIn.value);if(lv==null){lv=e.tl;lIn.value=fmt(lv)}x.l=lv}
  else if(d.L==='band'||d.L==='lvl')x.l=e.lv!=null?e.lv:e.tl;
  var r=parseNum(rIn.value);if(r==null||r<=0){err.hidden=false;rIn.focus();return}
  err.hidden=true;x.r=Math.round(r);x.ok=true;persist(s);updateCard(i);
}
app.addEventListener('input',function(ev){
  var el=ev.target;if(!el.dataset.f)return;var s=curSession();if(!s)return;
  var i=+el.dataset.i,j=+el.dataset.j,x=s.ex[i].sets[j],d=EX[s.ex[i].key];
  if(el.dataset.f==='l')x.l=parseNum(el.value);
  else{var v=parseNum(el.value);x.r=v==null?null:Math.round(v);var er=$('#err-'+i+'-'+j);if(er)er.hidden=true;if(x.ok&&!(x.r>0))x.ok=false}
  persist(s);updateCard(i);
});
app.addEventListener('keydown',function(ev){
  var el=ev.target;if(ev.key!=='Enter'||!el.dataset||el.dataset.f!=='r')return;ev.preventDefault();
  var i=+el.dataset.i,j=+el.dataset.j,s=curSession();if(!s)return;if(!s.ex[i].sets[j].ok)toggleSet(i,j);
  var nx=$('#r-'+i+'-'+(j+1))||$('#r-'+(i+1)+'-0');if(nx)nx.focus();
});
app.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='import-file'){importFile(el.files&&el.files[0]);return}
  if(el.dataset.lv!=null){var s=curSession();if(!s)return;var e=s.ex[+el.dataset.lv];e.lv=+el.value;e.sets.forEach(function(x){if(x.ok)x.l=e.lv});persist(s);updateCard(+el.dataset.lv);return}
  if(el.dataset.set){var st=S.docs.settings?JSON.parse(JSON.stringify(S.docs.settings)):{id:'settings',kind:'settings'};st.id='settings';st.kind='settings';st[el.dataset.set]=+el.value;persist(st);render()}
});
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,s;
  if(a==='nav'){S.view=b.dataset.view;S.confirm=null;if(S.view!=='today')S.cur=null;render();window.scrollTo(0,0)}
  else if(a==='pick'){S.pick=b.dataset.wo;render()}
  else if(a==='open'){S.cur={date:b.dataset.date,wo:b.dataset.wo};S.draft=null;S.view='today';render();window.scrollTo(0,0)}
  else if(a==='collapse'){S.cur=null;S.draft=null;S.confirm=null;render();window.scrollTo(0,0)}
  else if(a==='ok')toggleSet(+b.dataset.i,+b.dataset.j);
  else if(a==='addset'){s=curSession();if(s){s.ex[+b.dataset.i].sets.push({l:null,r:null,ok:false});persist(s);render()}}
  else if(a==='rmset'){s=curSession();if(s){var e=s.ex[+b.dataset.i];if(e.sets.length>e.n){e.sets.pop();persist(s);render()}}}
  else if(a==='resetex'){s=curSession();if(s){var er=s.ex[+b.dataset.i],ns=[];for(var q=0;q<er.n;q++)ns.push({l:null,r:null,ok:false});er.sets=ns;persist(s);render()}}
  else if(a==='finish'){s=curSession();if(s){s.done=true;s.finished=Date.now();persist(s);S.cur=null;S.draft=null;S.pick=null;render();window.scrollTo(0,0)}}
  else if(a==='reopen'){s=S.docs[b.dataset.id];if(s){s.done=false;persist(s);S.cur={date:s.date,wo:s.wo};S.view='today';render();window.scrollTo(0,0)}}
  else if(a==='del-ask'){S.confirm=b.dataset.id;render()}
  else if(a==='del-no'){S.confirm=null;render()}
  else if(a==='del-yes'){removeDoc(b.dataset.id);S.confirm=null;S.open=null;S.cur=null;S.draft=null;render()}
  else if(a==='hist'){S.open=S.open===b.dataset.id?null:b.dataset.id;S.confirm=null;render()}
  else if(a==='cardio'){var m=parseNum($('#cardio-min').value);if(m==null||m<=0){$('#cardio-err').hidden=false;return}var c={id:'c-'+todayStr()+'-'+rnd(),kind:'cardio',date:todayStr(),min:Math.round(m)};persist(c);render()}
  else if(a==='cdel'){removeDoc(b.dataset.id);render()}
  else if(a==='measure'){var w=parseNum($('#m-w').value),wa=parseNum($('#m-waist').value),hp=parseNum($('#m-hips').value);if(w==null&&wa==null&&hp==null){$('#m-err').hidden=false;return}persist({id:'m-'+todayStr()+'-'+rnd(),kind:'measure',date:todayStr(),w:w,waist:wa,hips:hp});render()}
  else if(a==='mdel'){removeDoc(b.dataset.id);render()}
  else if(a==='export')exportData();
});
function exportData(){
  try{var data=JSON.stringify({app:'forma-doma',v:1,exported:new Date().toISOString(),docs:S.docs},null,1),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='forma-doma-'+todayStr()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},2000);
    S.io=['good','Файл сохранён в «Загрузки»: forma-doma-'+todayStr()+'.json'];}catch(e){S.io=['bad','Не получилось сохранить файл.']}
  render();
}
function importFile(f){
  if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||o.app!=='forma-doma'||!o.docs)throw 0;var ad=0,up=0;
    Object.keys(o.docs).forEach(function(id){var r=o.docs[id],l=S.docs[id];if(!r||!r.kind)return;if(!l){S.docs[id]=r;ad++}else if((r.updatedAt||0)>(l.updatedAt||0)){S.docs[id]=r;up++}});
    saveLocal();S.io=['good','Импорт готов: новых записей '+ad+', обновлено '+up+'.']}catch(e){S.io=['bad','Это не файл «Формы дома». Выбери файл, сохранённый кнопкой «Экспорт».']}render()};
  rd.readAsText(f);
}

/* ---------- Boot ---------- */
loadLocal();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){
  var hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){reg.update();document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reg.update()})}).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!hadCtl){hadCtl=true;return}
    if(!S.cur){location.reload();return}
    if(!document.getElementById('upd')){var d=document.createElement('div');d.id='upd';d.className='upd';d.innerHTML='Вышло обновление приложения <button type="button" class="btn sm primary">Обновить</button>';d.querySelector('button').onclick=function(){location.reload()};document.body.appendChild(d)}
  });
}
})();
</script>

</body>
</html>
