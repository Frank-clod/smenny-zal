<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сменный зал</title>
<meta name="theme-color" content="#121519" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
<meta name="description" content="Личный дневник тренировок под график 2/2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-thumb column for the gym floor; plate-coded chips; bottom tab bar with a rest-timer dock above it */
:root{
  --bg:#121519; --surface:#1A1E24; --surface2:#232832; --line:#2E3440;
  --fg:#E9ECEF; --muted:#8D96A3; --accent:#5B9BFF; --accent-ink:#0A1830; --accent-bg:rgba(91,155,255,.14);
  --gold:#F2C230; --good:#45C07A; --good-bg:rgba(69,192,122,.15); --warn:#F0A43A; --warn-bg:rgba(240,164,58,.15);
  --bad:#EF5F57; --bad-bg:rgba(239,95,87,.15);
  --p25:#D93A2B; --p20:#2F6FE0; --p15:#E3B21F; --p10:#2E9D55; --p5:#F1F1F1; --p2:#2B2B2B; --p1:#A9AFB7; --plate-dark:#16181B; --plate-light:#FFFFFF;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow",sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EDEFF2; --surface:#FFFFFF; --surface2:#F3F5F8; --line:#D9DEE5;
  --fg:#14181E; --muted:#5B6572; --accent:#1F5FD1; --accent-ink:#FFFFFF; --accent-bg:rgba(31,95,209,.10);
  --gold:#9A7400; --good:#1B8A4C; --good-bg:rgba(27,138,76,.11); --warn:#AD6700; --warn-bg:rgba(214,138,20,.14);
  --bad:#C63A33; --bad-bg:rgba(198,58,51,.10); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface2:#F3F5F8; --line:#D9DEE5;
  --fg:#14181E; --muted:#5B6572; --accent:#1F5FD1; --accent-ink:#FFFFFF; --accent-bg:rgba(31,95,209,.10);
  --gold:#9A7400; --good:#1B8A4C; --good-bg:rgba(27,138,76,.11); --warn:#AD6700; --warn-bg:rgba(214,138,20,.14);
  --bad:#C63A33; --bad-bg:rgba(198,58,51,.10); color-scheme:light;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 170px;display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em}
.brand span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--good)} .sync.error .dot{background:var(--bad)} .sync.connecting .dot{background:var(--warn)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
h1{font-family:var(--f-display);font-size:32px;line-height:1.02;font-weight:700;text-wrap:balance;margin:2px 0 0}
h2{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:21px;font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:12px} .stack-s{display:grid;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.btn{font-weight:600;font-size:16px;border-radius:10px;padding:12px 16px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 2px 5px;text-align:center;font-size:11px;color:var(--muted);display:grid;gap:1px;min-width:0}
button.day{font:inherit;font-size:11px;cursor:pointer;min-height:84px;align-content:start}
.day.idle{opacity:.6}
.day.sel{background:var(--accent-bg);border-color:var(--accent);border-width:2px;padding:5px 1px 4px}
.wk{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:-6px}
.wk-b{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:44px;min-height:36px;font-size:20px;line-height:1;color:var(--fg)}
.day b{font-family:var(--f-display);font-size:19px;line-height:1.1;color:var(--fg);font-weight:600}
.day.today{border-color:var(--accent);border-width:2px;padding:5px 1px 4px}
.tag{font-family:var(--f-display);font-weight:600;font-size:12px;border-radius:6px;padding:1px 0;background:var(--accent-bg);color:var(--accent);margin-top:2px}
.tag.off{background:transparent;color:var(--muted);font-weight:500}
.tag.done{background:var(--good-bg);color:var(--good)}
.shift{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.chip{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-family:var(--f-display);font-weight:600;font-size:18px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.msg{border-radius:10px;padding:10px 12px;font-size:14px}
.msg.good{background:var(--good-bg)} .msg.warn{background:var(--warn-bg)} .msg.bad{background:var(--bad-bg)} .msg.info{background:var(--accent-bg)}
.msg strong{font-weight:600}
.msg.good strong{color:var(--good)} .msg.warn strong{color:var(--warn)} .msg.bad strong{color:var(--bad)} .msg.info strong{color:var(--accent)}
.target{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.target b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.target .unit{color:var(--muted);font-size:13px}
.target .sch{font-family:var(--f-display);font-size:20px;font-weight:600;margin-left:auto}
.plates{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.plate{font:700 12px/1 var(--f-mono);border-radius:4px;padding:4px 6px;color:var(--plate-light)}
.plate.k25{background:var(--p25)} .plate.k20{background:var(--p20)} .plate.k15{background:var(--p15);color:var(--plate-dark)}
.plate.k10{background:var(--p10)} .plate.k5{background:var(--p5);color:var(--plate-dark);box-shadow:inset 0 0 0 1px var(--line)}
.plate.k2{background:var(--p2)} .plate.k1{background:var(--p1);color:var(--plate-dark)}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.set-h{font-size:12px;color:var(--muted)}
.set .n{font-family:var(--f-display);color:var(--muted);font-size:16px;text-align:center}
.set input{font:600 21px var(--f-display);background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:8px 6px;width:100%;min-height:48px;text-align:center;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--muted);opacity:.75}
.set.done input{border-color:var(--good);background:var(--good-bg)}
.ok{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);display:grid;place-items:center}
.set.done .ok{background:var(--good);border-color:var(--good);color:var(--bg)}
.err{color:var(--bad);font-size:13px;grid-column:2 / -1}
.meter{position:relative;height:10px;background:var(--surface2);border-radius:5px;margin-top:4px}
.meter .fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:var(--accent);transition:width .25s}
.meter .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);left:80%;border-radius:1px}
.meter.up .fill{background:var(--good)} .meter.down .fill{background:var(--warn)}
.meter-l{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.meter-l b{color:var(--fg);font-weight:600}
.ex.skip{opacity:.8}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.badge{font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .r{text-align:right;font-family:var(--f-display);font-size:18px;font-weight:600;white-space:nowrap}
.li .why{grid-column:1 / -1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.tile b{font:700 26px/1.05 var(--f-display);display:block;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-txt{fill:var(--muted);font:11px var(--f-body)}
.ch-line{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--accent);opacity:.13}
.ch-dot{fill:var(--accent)}
.ch-end{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.ch-goal{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:6 5}
.ch-goal-t{fill:var(--gold);font:600 12px var(--f-body)}
.ch-val{fill:var(--fg);font:700 14px var(--f-display)}
.elbows{display:flex;gap:3px;flex-wrap:wrap}
.eb{width:18px;height:18px;border-radius:4px;background:var(--surface2);font:600 10px/18px var(--f-mono);text-align:center;color:var(--fg)}
.eb.g{background:var(--good-bg);color:var(--good)} .eb.w{background:var(--warn-bg);color:var(--warn)} .eb.b{background:var(--bad-bg);color:var(--bad)}
select,.field{font:500 16px var(--f-body);background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
label.lbl{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--fg)}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
details{border-top:1px solid var(--line);padding-top:10px}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;font-family:var(--f-display);font-size:19px;font-weight:600;list-style-position:outside}
.sw{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.sw input{font:600 17px var(--f-display);text-align:center;min-height:40px;padding:6px}
.cal{display:grid}
.cal-r{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center;font-size:14px}
button.cal-r{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.cal-r:first-child{border-top:0}
.cal-r.today{font-weight:600}
.phase{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:8px 10px;border-radius:10px}
.phase.on{background:var(--accent-bg)}
.phase b{font-family:var(--f-display);font-size:18px}
.hbtn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;cursor:pointer;padding:12px 0;border-top:1px solid var(--line)}
.hbtn:first-child{border-top:0}
.hbtn:focus-visible{outline:2px solid var(--accent)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));z-index:10}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;color:var(--muted);font-size:12px;font-weight:500;display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:52px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rest{position:fixed;left:0;right:0;bottom:calc(134px + env(safe-area-inset-bottom,0px));z-index:9;padding-inline:12px}
.rest-in{max-width:540px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.rest.go .rest-in{background:var(--accent);color:var(--accent-ink)}
.rest-time{font:700 28px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.rest-lab{font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest button{background:transparent;border:1px solid currentColor;border-radius:8px;min-height:40px;min-width:44px;font-weight:600;font-size:14px;color:inherit}
.rest-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.rest.go .rest-bar{background:var(--accent-ink)}
.pset{display:grid;gap:4px}
.pset div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;background:var(--surface2);border-radius:8px;font-size:14px}
.pset b{font-family:var(--f-display);font-size:17px;font-weight:600}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.go-bar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:9;padding-inline:12px}
.go-in{max-width:540px;margin:0 auto;background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px}
.go-in>div{flex:1;min-width:0;display:grid}
.go-in b{font-family:var(--f-display);font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go-in span{font-size:12px;color:var(--muted)}
.go-in .btn{min-height:46px;padding-inline:18px}
.tech{border-top:0;padding-top:0}
.tech summary{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--accent)}
.tech .kv{margin-top:8px}
.fail-note{font-size:12px;font-weight:600;color:var(--bad);margin:2px 0 -4px 28px;letter-spacing:.02em}
.set.fail input{border-color:var(--bad)}
.set.fail.done input{border-color:var(--good)}
.pset .fail{background:var(--bad-bg)}
.pset .fail .muted{color:var(--bad)}
.fail-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:2px 7px;margin-top:3px}
.block{border-top:1px solid var(--line);padding-top:12px}
.block summary{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px}
.blist{display:grid}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.brow b{color:var(--fg);font-family:var(--f-display);font-size:15px}
.dchip{font:600 12px var(--f-mono);border-radius:6px;padding:2px 6px;background:var(--surface2);color:var(--muted);white-space:nowrap;min-width:58px;text-align:center}
.dchip.up{background:var(--good-bg);color:var(--good)} .dchip.down{background:var(--warn-bg);color:var(--warn)}
.bb{fill:var(--line)} .bb.last{fill:var(--accent)}
.fig{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;background:var(--surface2);border-radius:12px;padding:8px 6px 6px}
.fig figure{margin:0;display:grid;gap:2px;justify-items:center;min-width:0}
.fig svg{width:100%;max-width:150px;height:auto;display:block}
.fig figcaption{font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.fig-arrow{color:var(--muted);font-size:16px}
.fg-body{fill:none;stroke:var(--fg);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.fg-head{fill:var(--fg)}
.fg-arm{fill:none;stroke:var(--accent);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fg-plate{fill:var(--p15)}
.fg-grip{fill:var(--p15)}
.fg-floor{stroke:var(--line);stroke-width:1.5}
.fg-bench{fill:var(--line)}
.fg-benchline{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
.fg-eq{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
.fg-cable{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2.5 2}
.fg-pulley{fill:var(--muted)}
.fg-plat{stroke:var(--p15);stroke-width:5;stroke-linecap:round}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
@media (hover:none){.kbd-tip{display:none}}
@media (min-width:900px){.app{max-width:680px}.rest-in,.go-in{max-width:660px}.nav-in{max-width:680px}}
@media (max-width:370px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))} h1{font-size:28px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app"><p class="muted">Загрузка…</p></div>

<div class="rest" id="rest" hidden>
  <div class="rest-in">
    <div class="rest-time" id="rest-time">0:00</div>
    <div class="rest-lab" id="rest-lab">Отдых</div>
    <button type="button" data-act="rest-minus" aria-label="Минус 15 секунд">−15</button>
    <button type="button" data-act="rest-plus" aria-label="Плюс 15 секунд">+15</button>
    <button type="button" data-act="rest-stop" aria-label="Закрыть таймер">✕</button>
    <div class="rest-bar" id="rest-bar"></div>
  </div>
</div>

<nav class="nav" aria-label="Разделы">
  <div class="nav-in">
    <button type="button" data-act="nav" data-view="today"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Сегодня</button>

var GOAL=Math.round(brz(103,3));
var DEF={kind:'settings',start:'2026-10-05',legs:true,dbStep:2,bar:20,ez:10,startW:{}};

/* ---------- Utils ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function fromStr(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function todayStr(){return toStr(new Date())}
function addDays(s,n){var d=fromStr(s);d.setDate(d.getDate()+n);return toStr(d)}
function utc(s){var a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])}
function diffDays(a,b){return Math.round((utc(b)-utc(a))/864e5)}
function mod(a,n){return ((a%n)+n)%n}
var WD=['вс','пн','вт','ср','чт','пт','сб'];
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

function floorTo(x,st){return Math.round(Math.floor(x/st+1e-9)*st*100)/100}
function roundTo(x,st){return Math.round(Math.round(x/st)*st*100)/100}
function rnd(){return Math.random().toString(36).slice(2,7)}

function numRu(n){return Math.round(n).toLocaleString('ru-RU')}

/* ---------- State ---------- */
var S={docs:{},view:'today',open:null,confirm:null,chartKey:null,sel:null,wk:0};
var LS='smenny-zal-v1';

function settings(){var s=S.docs.settings||{};var o={};for(var k in DEF)o[k]=DEF[k];for(var k2 in s)o[k2]=s[k2];if(!o.startW)o.startW={};return o}
function sessions(){return Object.keys(S.docs).map(function(k){return S.docs[k]}).filter(function(d){return d&&d.kind==='session'}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.started||0)-(b.started||0)})}
function activeSession(){var t=todayStr();var a=sessions().filter(function(s){return !s.done&&s.date===t});return a[a.length-1]||null}
function doneOn(d){return sessions().filter(function(s){return s.done&&s.date===d})}

/* ---------- Schedule ---------- */
function dayIdx(s){return diffDays(settings().start,s)}

function isTrain(s){var i=dayIdx(s);return i>=0&&PLAN[mod(i,6)]===1}
function weekOf(s){return Math.max(1,Math.floor(dayIdx(s)/7)+1)}
function phaseOf(s){var w=weekOf(s);return w<=3?1:w<=8?2:3}
/* Calendar decides the workout: circle 1,3,5… = barbell, 2,4,6… = dumbbells; 1st training day = heavy, 2nd = volume */
function woOf(d){var i=dayIdx(d);if(i<0)return null;var pos=mod(i,6);if(pos!==0&&pos!==2)return null;return (Math.floor(i/6)%2?'B':'A')+(pos===0?'1':'2')}
function nextWo(){var t=todayStr();if(woOf(t))return woOf(t);for(var i=1;i<14;i++){var w=woOf(addDays(t,i));if(w)return w}return 'A1'}
function planned(from,days){
  var out=[],all=sessions();
  for(var i=0;i<days;i++){
    var d=addDays(from,i);
    var ss=all.filter(function(s){return s.date===d});
    var it={date:d,shift:shiftOf(d),train:isTrain(d),sess:ss[ss.length-1]||null,wo:null};
    it.wo=it.sess?it.sess.wo:woOf(d);

}
function baseDay(){var t=todayStr(),s=settings().start;return t<s?s:t}

  var t=todayStr(),st0=settings().start;
  sessions().forEach(function(s){
    if(s.done)return;
    var any=(s.ex||[]).some(function(e){return e.sets.some(function(x){return x.ok})});
    if(!any&&(s.date!==t||dayIdx(s.date)<0))removeDoc(s.id);
    else if(any&&s.date<t){s.done=true;s.finished=s.updatedAt||Date.now();persist(s)}
  });
}
function nextTraining(){var p=planned(addDays(todayStr(),1),14);for(var i=0;i<p.length;i++)if(p[i].train&&p[i].wo)return p[i];return null}

/* ---------- Progression ---------- */
function incOf(k){var d=EX[k];if(d.inc)return d.inc;if(d.t==='db'||d.t==='db1')return settings().dbStep||2;return 2.5}
function startW(k){var v=settings().startW[k];return (v!=null&&v!=='')?+v:EX[k].start}
function schemeOf(k,ph){var d=EX[k];if(d.ph){var a=d.ph[ph];return {n:a[0],lo:a[1],hi:a[2]}}return {n:d.sets,lo:d.lo,hi:d.hi}}
function entriesBefore(k,s){
  var out=[];
  sessions().forEach(function(x){
    if(s){if(x.id===s.id)return;if(x.date>s.date||(x.date===s.date&&(x.started||0)>(s.started||0)))return}
    (x.ex||[]).forEach(function(e){
      if(e.key!==k)return;
      var st=(e.sets||[]).filter(function(y){return y.ok&&y.r>0&&y.w!=null});
      if(st.length)out.push({date:x.date,sets:st,n:e.n,lo:e.lo,hi:e.hi,sid:x.id});
    });
  });
  return out;
}
function isShort(h,sc){var n=h.n||sc.n,lo=h.lo||sc.lo;return h.sets.length<n||Math.min.apply(null,h.sets.map(function(x){return x.r}))<lo}
function maxW(h){return Math.max.apply(null,h.sets.map(function(x){return x.w}))}
function targetFrom(k,hist,ph){
  var sc=schemeOf(k,ph),st=incOf(k),r={n:sc.n,lo:sc.lo,hi:sc.hi};
  if(!hist.length){r.w=startW(k);r.kind='start';r.why='Стартовый вес после перерыва. Пошло легко — впиши больше.';return r}
  var last=hist[hist.length-1],lw=maxW(last),reps=last.sets.map(function(x){return x.r}),minR=Math.min.apply(null,reps),full=last.sets.length>=sc.n;
  if(!isShort(last,sc)){
    if(full&&minR>=sc.hi+2){
      var e1=Math.max.apply(null,last.sets.map(function(x){return brz(x.w,x.r)}));
      r.w=Math.max(lw+st,floorTo(e1*(37-sc.hi)/36,st));r.kind='jump';
      r.why='В прошлый раз повторов было заметно больше диапазона, вес пересчитан от силы';
    }else if(full&&minR>=sc.hi){r.w=lw+st;r.kind='up';r.why='+'+fmt(st)+' кг: в прошлый раз все подходы на '+sc.hi+'+'}
    else{r.w=lw;r.kind='same';r.why='Тот же вес: добивай повторы до '+sc.hi+' во всех подходах'}
  }else{
    var prev=hist[hist.length-2];
    if(prev&&isShort(prev,sc)&&maxW(prev)>=lw){r.w=floorTo(lw*0.9,st);r.kind='deload';r.why='−10%: два недобора подряд, откат и снова вверх'}
    else{r.w=lw;r.kind='repeat';r.why='Тот же вес: в прошлый раз недобор, цель — '+sc.lo+'+ в каждом подходе'}

}
function effW(s,e){
  var d=EX[e.key],w=e.tw,st=incOf(e.key);
  if(s.elbow!=null&&d.upper){
    if(s.elbow>=5&&e.forced)w=floorTo(w*0.7,st);

  }

}
function makeEx(k,orig,s){
  var t=targetFrom(k,entriesBefore(k,s),phaseOf(s.date));
  var sets=[];for(var i=0;i<t.n;i++)sets.push({w:null,r:null,ok:false});
  return {key:k,orig:orig,n:t.n,lo:t.lo,hi:t.hi,tw:t.w,why:t.why,kind:t.kind,sets:sets};
}
function vol(sets){return sets.reduce(function(a,x){return a+(x.ok&&x.r>0&&x.w!=null?x.w*x.r:0)},0)}
function sessVol(s){return (s.ex||[]).reduce(function(a,e){return a+vol(e.sets||[])},0)}
function sessSets(s){var d=0,t=0;(s.ex||[]).forEach(function(e){if(isSkipped(s,e))return;t+=e.sets.length;d+=e.sets.filter(function(x){return x.ok}).length});return {d:d,t:t}}
function prevSessionSame(s){var a=sessions().filter(function(x){return x.wo===s.wo&&x.id!==s.id&&x.done&&(x.date<s.date||(x.date===s.date&&(x.started||0)<(s.started||0)))});return a[a.length-1]||null}
function isSkipped(s,e){return s.elbow!=null&&s.elbow>=5&&EX[e.key].upper&&!e.forced}
function setsTxt(sets){
  var ws=sets.map(function(x){return x.w});
  var same=ws.every(function(w){return w===ws[0]});
  if(same)return fmt(ws[0])+' × '+sets.map(function(x){return x.r}).join(', ');

}
function unitOf(k){var t=EX[k].t;if(t==='machine')return 'кг на тренажёре';return t==='db'?'кг в каждой руке':t==='db1'?'кг, одна гантель':t==='cable'?'кг на блоке':'кг на штанге'}
function platesFor(w,bar){
  var side=(w-bar)/2;if(side<=0)return null;
  var P=[25,20,15,10,5,2.5,1.25],out=[],rem=side;
  P.forEach(function(p){while(rem>=p-1e-9){out.push(p);rem=Math.round((rem-p)*1000)/1000}});
  return {plates:out,rem:rem};
}
function plateCls(p){return p===25?'k25':p===20?'k20':p===15?'k15':p===10?'k10':p===5?'k5':p===2.5?'k2':'k1'}

/* ---------- Sync ---------- */
var STANDALONE=!(window.claude&&typeof window.claude.use==='function');
var cleaned=false,COL=null,syncState='local',seenRemote={},deleted={},timers={},inflight={},again={},renderPending=false;
function setSync(st){syncState=st;var el=$('#sync');if(el)el.outerHTML=syncHTML()}
function syncHTML(){
  var t={local:STANDALONE?'Хранится в этом телефоне':'Только этот браузер',connecting:'Подключаю…',ok:'Сохранено в аккаунте',error:'Нет связи, пишу локально'}[syncState];
  return '<div class="sync '+syncState+'" id="sync"><span class="dot"></span>'+t+'</div>';
}
function persist(doc){doc.updatedAt=Date.now();S.docs[doc.id]=doc;saveLocal();queueWrite(doc.id,900)}
function removeDoc(id){deleted[id]=1;delete S.docs[id];saveLocal();queueWrite(id,0)}
function queueWrite(id,delay){if(!COL)return;clearTimeout(timers[id]);timers[id]=setTimeout(function(){flush(id)},delay)}
function flush(id){
  if(!COL)return;
  if(inflight[id]){again[id]=true;return}
  inflight[id]=true;
  var p=deleted[id]?COL.doc(id).delete():(S.docs[id]?COL.doc(id).set(JSON.parse(JSON.stringify(S.docs[id]))):Promise.resolve());
  p.then(function(){seenRemote[id]=1;if(syncState!=='ok')setSync('ok')})
   .catch(function(e){
     if(e&&e.code==='unavailable'){setTimeout(function(){flush(id)},1500+Math.random()*1500)}
     else setSync('error');
   })
   .then(function(){inflight[id]=false;if(again[id]){again[id]=false;flush(id)}});
}
function onSnap(snap){
  var changed=false,present={};
  snap.docs.forEach(function(ds){
    if(!ds.exists)return;
    var id=ds.id;present[id]=1;seenRemote[id]=1;
    if(deleted[id])return;
    var r=ds.data(),l=S.docs[id];
    if(!l||(r.updatedAt||0)>(l.updatedAt||0)){S.docs[id]=JSON.parse(JSON.stringify(r));changed=true}
  });
  if(!snap.metadata.fromCache){
    Object.keys(S.docs).forEach(function(id){
      if(present[id])return;
      if(seenRemote[id]&&!inflight[id]){
        if(!(S.docs[id]&&S.docs[id].updatedAt>Date.now()-5000)){delete S.docs[id];changed=true}
      }else queueWrite(id,200);
    });
    if(syncState!=='error')setSync('ok');
    if(!cleaned){cleaned=true;setTimeout(function(){cleanupStale();render()},0)}
  }
  if(changed){saveLocal();requestRender()}
}
function connect(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return}
  setSync('connecting');
  Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(a){
    var user=a[0],db=a[1];
    if(!user||!db){setSync('local');return null}
    return user.id().then(function(id){
      if(!id){setSync('local');return}
      COL=db.collection('data/users/'+id);
      COL.onSnapshot(onSnap,function(){setSync('error')});
    });
  }).catch(function(){setSync('local')});
}
function requestRender(){
  var a=document.activeElement;
  if(a&&app.contains(a)&&(a.tagName==='INPUT'||a.tagName==='SELECT')){renderPending=true;return}
  render();
}
app.addEventListener('focusout',function(){if(renderPending){setTimeout(function(){var a=document.activeElement;if(!(a&&app.contains(a)&&a.tagName==='INPUT')){renderPending=false;render()}},50)}});

/* ---------- Views ---------- */

}

  return planned(from,days);
}
function strip(){

  }).join('')+'</div>';
}
function circleInfo(d){var i=dayIdx(d);return 'Круг '+(Math.floor(i/6)+1)+' · день '+(mod(i,6)+1)+' из 6'}
function exDetail(k,date,idx,total){
  var ph=phaseOf(date),t=targetFrom(k,entriesBefore(k,null),ph),d=EX[k],st=settings(),prev=entriesBefore(k,null).pop();

function dayPlan(d,wo,full){

function viewDay(d){

function chartSVG(pts,goal){
  var W=340,H=200,L=34,R=14,T=16,B=26;

  var span=Math.max(10,hi-lo);lo=Math.floor((lo-span*0.08)/5)*5;hi=Math.ceil((hi+span*0.08)/5)*5;
  var steps=[5,10,20,25,50],step=steps[steps.length-1];
  for(var si=0;si<steps.length;si++){if((hi-lo)/steps[si]<=5){step=steps[si];break}}
  function x(i){return pts.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(pts.length-1)}
  function y(v){return T+(hi-v)*(H-T-B)/(hi-lo)}
  var g='';
  for(var v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+='<line class="ch-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text class="ch-txt" x="'+(L-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+v+'</text>';
  if(goal)g+='<line class="ch-goal" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(goal).toFixed(1)+'" y2="'+y(goal).toFixed(1)+'"/><text class="ch-goal-t" x="'+(W-R)+'" y="'+(y(goal)-6).toFixed(1)+'" text-anchor="end">цель 103×3 ≈ '+goal+'</text>';

/* ---------- Blocks: 12 days = 4 workouts (Ш·1, Ш·2, Г·1, Г·2) ---------- */
function blockOf(d){var i=dayIdx(d);return i<0?-1:Math.floor(i/12)}
function blockRange(b){var s=addDays(settings().start,b*12);return {from:s,to:addDays(s,11)}}
function blocksData(){
  var map={};
  sessions().filter(function(s){return s.done}).forEach(function(s){
    var b=blockOf(s.date);if(b<0)return;
    var o=map[b]||(map[b]={b:b,sessions:[],vol:0,sets:0,elb:[],best:{}});
    o.sessions.push(s);o.vol+=sessVol(s);
    if(s.elbow!=null)o.elb.push(s.elbow);
    s.ex.forEach(function(e){e.sets.forEach(function(x){if(x.ok&&x.r>0){o.sets++;var v=brz(x.w,x.r);if(!o.best[e.key]||v>o.best[e.key])o.best[e.key]=v}})});
  });
  return Object.keys(map).map(function(k){var o=map[k];o.wos={};o.sessions.forEach(function(s){o.wos[s.wo]=1});o.n=Object.keys(o.wos).length;o.bench=Math.max(o.best.bb_bench||0,o.best.bb_bench_vol||0);return o}).sort(function(a,b){return a.b-b.b});
}
function pct(a,b){return b?Math.round((a/b-1)*100):null}

function blockBars(bl){

    g+='<text class="ch-val" x="'+cx.toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" style="font-size:12px">'+(o.vol>=1000?fmt(Math.round(o.vol/100)/10)+'т':Math.round(o.vol))+'</text>';

function toggleSet(i,j){

  var nextRow=e.sets[j+1];

  if(el.dataset.f){
    var s=curSession();if(!s)return;
    var i=+el.dataset.i,j=+el.dataset.j,x=s.ex[i].sets[j];
    var v=parseNum(el.value);
    if(el.dataset.f==='w')x.w=v;else{x.r=v==null?null:Math.round(v);var er=$('#err-'+i+'-'+j);if(er)er.hidden=true;if(x.ok&&!(x.r>0))x.ok=false}
    persist(s);updateCard(i);
  }
});
app.addEventListener('keydown',function(ev){
  var el=ev.target;if(ev.key!=='Enter'||!el.dataset||!el.dataset.f)return;
  ev.preventDefault();var i=+el.dataset.i,j=+el.dataset.j;
  if(el.dataset.f==='w'){var r=$('#r-'+i+'-'+j);if(r)r.focus();return}
  var s=curSession();if(!s)return;
  if(!s.ex[i].sets[j].ok)toggleSet(i,j);
  if(!s.ex[i].sets[j].ok)return;
  var nx=$('#w-'+i+'-'+(j+1))||$('#w-'+(i+1)+'-0');
  if(nx){nx.focus();nx.select()}
});
app.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='import-file'){importFile(el.files&&el.files[0]);return}
  if(el.id==='chart-key'){S.chartKey=el.value;render();return}
  if(el.dataset.set||el.dataset.sw){
    var st=S.docs.settings?JSON.parse(JSON.stringify(S.docs.settings)):{id:'settings',kind:'settings'};
    st.id='settings';st.kind='settings';
    if(el.dataset.sw){if(!st.startW)st.startW={};var n=parseNum(el.value);if(n!=null&&n>=0)st.startW[el.dataset.sw]=n;else delete st.startW[el.dataset.sw]}
    else{
      var f=el.dataset.set;
      if(f==='legs')st.legs=el.checked;
      else if(f==='start'){if(/^\d{4}-\d{2}-\d{2}$/.test(el.value))st.start=el.value;else return}
      else{var n2=parseNum(el.value);if(n2==null||n2<0)return;st[f]=n2}
    }
    persist(st);render();
  }
});
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  unlockAudio();
  var a=b.dataset.act,s;
  if(a==='nav'){S.view=b.dataset.view;S.confirm=null;if(S.view==='today'){S.sel=null;S.wk=0;if(S.cur!==todayStr())S.cur=null}render();window.scrollTo(0,0)}
  else if(a==='open'){S.cur=b.dataset.date;S.draftWo=b.dataset.wo||null;S.draft=null;S.confirm=null;render();window.scrollTo(0,0)}
  else if(a==='collapse'){S.cur=null;S.draft=null;S.confirm=null;render();window.scrollTo(0,0)}
  else if(a==='day'){var dd=b.dataset.date,tt=todayStr();S.sel=dd===tt?null:dd;if(S.cur!==dd)S.cur=null;S.view='today';S.confirm=null;S.wk=Math.floor(diffDays(baseDay(),dd)/7);render();window.scrollTo(0,0)}
  else if(a==='detail-close'){S.detail=null;render();window.scrollTo(0,0)}
  else if(a==='detail'){S.detail=b.dataset.date;render();window.scrollTo(0,0)}
  else if(a==='export'){exportData()}
  else if(a==='wk'){S.wk+=+b.dataset.d;render()}
  else if(a==='start'){startSession(b.dataset.wo)}
  else if(a==='elbow'){s=curSession();setElbow(s&&s.elbow===+b.dataset.v?null:+b.dataset.v)}
  else if(a==='elbow-reset'){setElbow(null)}
  else if(a==='rmset'){s=curSession();if(s){var ee=s.ex[+b.dataset.i];if(ee.sets.length>ee.n){ee.sets.pop();persist(s);render()}}}
  else if(a==='resetex'){s=curSession();if(s){var er=s.ex[+b.dataset.i],ns=[];for(var q=0;q<er.n;q++)ns.push({w:null,r:null,ok:false});er.sets=ns;persist(s);render()}}
  else if(a==='ok'){toggleSet(+b.dataset.i,+b.dataset.j)}
  else if(a==='addset'){s=curSession();if(s){s.ex[+b.dataset.i].sets.push({w:null,r:null,ok:false});persist(s);render()}}
  else if(a==='force'){s=curSession();if(s){s.ex[+b.dataset.i].forced=true;persist(s);render()}}
  else if(a==='finish'){s=curSession();if(s){s.done=true;s.finished=Date.now();persist(s);S.cur=null;S.draft=null;T=null;tick();render();window.scrollTo(0,0)}}
  else if(a==='reopen'){s=S.docs[b.dataset.id];if(s){s.done=false;persist(s);S.cur=s.date;S.draft=null;render();window.scrollTo(0,0)}}
  else if(a==='del-ask'){S.confirm=b.dataset.id;render()}
  else if(a==='del-no'){S.confirm=null;render()}
  else if(a==='del-yes'){removeDoc(b.dataset.id);if(S.draft&&S.draft.id===b.dataset.id)S.draft=null;S.cur=null;S.confirm=null;S.open=null;render()}
  else if(a==='hist'){S.open=S.open===b.dataset.id?null:b.dataset.id;S.confirm=null;render()}
  else if(a==='rest-minus'){if(T){T.end-=15000;T.fired=false;tick()}}
  else if(a==='rest-plus'){if(T){T.end+=15000;T.total+=15;T.fired=false;tick()}}
  else if(a==='rest-stop'){T=null;tick()}
});

/* ---------- Rest timer ---------- */
var T=null,AC=null;
function unlockAudio(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function beep(){
  try{if(!AC)return;var t0=AC.currentTime;[0,0.28,0.56].forEach(function(o){var os=AC.createOscillator(),g=AC.createGain();os.frequency.value=880;g.gain.setValueAtTime(0.0001,t0+o);g.gain.exponentialRampToValueAtTime(0.3,t0+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+o+0.2);os.connect(g);g.connect(AC.destination);os.start(t0+o);os.stop(t0+o+0.22)})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}
}
function startRest(sec,label){T={end:Date.now()+sec*1000,total:sec,label:label,fired:false};tick()}
function tick(){
  var bar=$('#rest');
  if(!T){bar.hidden=true;return}
  var left=Math.ceil((T.end-Date.now())/1000);
  if(left<=0&&!T.fired){T.fired=true;beep()}
  if(left<-90){T=null;bar.hidden=true;return}
  bar.hidden=false;
  bar.classList.toggle('go',left<=0);
  $('#rest-time').textContent=mmss(left);
  $('#rest-lab').textContent=left>0?'Отдых · '+T.label:'Пора: '+T.label;
  $('#rest-bar').style.width=(left>0?(1-left/T.total)*100:100).toFixed(1)+'%';
}
setInterval(tick,250);

var WL=null;
function keepAwake(on){
  try{
    if(on&&!WL&&navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){WL=l;l.addEventListener('release',function(){WL=null})}).catch(function(){})}
    else if(!on&&WL){WL.release().catch(function(){});WL=null}
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){keepAwake(S.view==='today'&&!!S.cur);tick()}});

/* ---------- Backup ---------- */
function exportData(){
  try{
    var data=JSON.stringify({app:'smenny-zal',v:1,exported:new Date().toISOString(),docs:S.docs},null,1);
    var blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='smenny-zal-'+todayStr()+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},2000);
    S.ioMsg=['good','Файл сохранён в «Загрузки»: smenny-zal-'+todayStr()+'.json'];
  }catch(e){S.ioMsg=['bad','Не получилось сохранить файл.']}
  render();
}
function importFile(f){
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result);if(!o||o.app!=='smenny-zal'||!o.docs)throw 0;
      var added=0,updated=0;
      Object.keys(o.docs).forEach(function(id){var r=o.docs[id],l=S.docs[id];if(!r||!r.kind)return;if(!l){S.docs[id]=r;added++}else if((r.updatedAt||0)>(l.updatedAt||0)){S.docs[id]=r;updated++}});
      saveLocal();S.ioMsg=['good','Импорт готов: новых записей '+added+', обновлено '+updated+'.'];
    }catch(e){S.ioMsg=['bad','Это не файл «Сменного зала». Выбери файл, сохранённый кнопкой «Экспорт».']}
    render();
  };
  rd.readAsText(f);
}

/* ---------- Boot ---------- */
loadLocal();
cleanupStale();
(function(){var a=activeSession();if(a&&a.ex.some(function(e){return e.sets.some(function(x){return x.ok})}))S.cur=a.date})();
render();
if(STANDALONE){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
}else connect();
})();
</script>
